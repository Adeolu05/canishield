services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zecproof
      POSTGRES_PASSWORD: zecproof
      POSTGRES_DB: zecproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zecproof"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
